<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Yahtzee</title>
  <meta name="description" content="Single-player Yahtzee that works offline.">
  <meta name="theme-color" content="#22684d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <h1>
        <svg class="logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="6" fill="var(--accent)"/>
          <circle cx="8" cy="8" r="1.8" fill="var(--accent-ink)"/>
          <circle cx="16" cy="8" r="1.8" fill="var(--accent-ink)"/>
          <circle cx="12" cy="12" r="1.8" fill="var(--accent-ink)"/>
          <circle cx="8" cy="16" r="1.8" fill="var(--accent-ink)"/>
          <circle cx="16" cy="16" r="1.8" fill="var(--accent-ink)"/>
        </svg>
        Yahtzee <span class="ver">v15</span>
      </h1>
      <div class="round" id="round">Round 1 / 13</div>
      <div class="best" id="bestScore" hidden>🏆 Best <span id="bestVal">0</span></div>
      <div class="streak" id="streak" hidden>🔥 Hot streak</div>
      <div class="spacer"></div>
      <button type="button" class="ghost icon-btn" id="confettiToggle" aria-label="Confetti on every roll" title="Confetti on every roll" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 L14 10"/><rect x="15.5" y="3.5" width="3" height="3" rx=".5" transform="rotate(20 17 5)"/><rect x="5" y="13" width="3" height="3" rx=".5" transform="rotate(-15 6.5 14.5)"/><circle cx="19" cy="11" r="1.3" fill="currentColor" stroke="none"/><circle cx="10" cy="4.5" r="1.3" fill="currentColor" stroke="none"/><path d="M13 7 l1.5 1.5"/></svg>
      </button>
      <button type="button" class="ghost icon-btn" id="themeBtn" aria-label="Themes" title="Themes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="7.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="16.5" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="16.5" r="1.2" fill="currentColor" stroke="none"/><circle cx="7.5" cy="12" r="1.2" fill="currentColor" stroke="none"/></svg>
      </button>
      <button type="button" class="ghost" id="newGame">New game</button>
    </header>

    <main class="board">
      <section class="card" id="scorecard" aria-label="Scorecard">
        <div class="col" id="upperCol">
          <h2>Upper</h2>
        </div>
        <div class="col" id="lowerCol">
          <h2>Lower</h2>
        </div>
        <div class="grand">
          <span>Total</span>
          <strong id="grand">0</strong>
        </div>
      </section>

      <section class="play" aria-label="Dice">
        <p class="status" id="status" aria-live="polite"></p>
        <div class="dice" id="dice"></div>
        <div class="actions">
          <button type="button" class="secondary" id="undo" hidden>Undo</button>
          <button type="button" class="primary" id="roll">Roll</button>
        </div>
      </section>
    </main>
  </div>

  <div class="overlay" id="gameOver" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="goTitle">
      <h2 id="goTitle">Game over</h2>
      <div class="final" id="finalScore">0</div>
      <p class="newHigh" id="newHigh" hidden>🏆 New high score!</p>
      <p class="verdict" id="verdict"></p>
      <dl class="breakdown">
        <dt>Upper section</dt><dd id="bdUpper">0</dd>
        <dt>Upper bonus</dt><dd id="bdBonus">0</dd>
        <dt>Lower section</dt><dd id="bdLower">0</dd>
        <dt>Yahtzee bonus</dt><dd id="bdYB">0</dd>
      </dl>
      <div class="actions">
        <button type="button" class="secondary" id="goUndo">Undo last move</button>
        <button type="button" class="primary" id="goNew">New game</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="themePicker" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="themeTitle">
      <h2 id="themeTitle">Theme</h2>
      <div class="themes" id="themeGrid"></div>
      <div class="actions">
        <button type="button" class="primary" id="themeClose">Done</button>
      </div>
    </div>
  </div>

  <canvas id="confetti" hidden></canvas>
  <div id="bannerHost"></div>
  <div class="flashOverlay" id="flashOverlay"></div>

  <script src="app.js"></script>
</body>
</html>
